<script>
/* =========================================================================
   ALMACENAMIENTO PERSISTENTE (window.storage) — datos compartidos entre
   quienes abran este artefacto: usuarios, clientes, reportes y mensajes
   viven en storage "shared" para simular un backend real multiusuario.
   ========================================================================= */
const KEYS = { usuarios:'usuarios', clientes:'clientes', reportes:'reportes', mensajes:'mensajes', rangos:'rangos' };

// window.storage solo existe dentro del panel de artefactos de Claude.ai.
// Si el archivo se abre suelto en el navegador (doble clic / file://), usamos
// localStorage como respaldo para que el guardado funcione igual.
const TIENE_CLOUD_STORAGE = (typeof window !== 'undefined' && typeof window.storage !== 'undefined');
const LS_PREFIX = 'fumigaciones_';

async function loadKey(key, fallback){
  try{
    if(TIENE_CLOUD_STORAGE){
      const r = await window.storage.get(key, true);
      return r ? JSON.parse(r.value) : fallback;
    } else {
      const raw = localStorage.getItem(LS_PREFIX + key);
      return raw ? JSON.parse(raw) : fallback;
    }
  }catch(e){ console.error('loadKey', key, e); return fallback; }
}
async function saveKey(key, value){
  try{
    if(TIENE_CLOUD_STORAGE){
      await window.storage.set(key, JSON.stringify(value), true);
    } else {
      localStorage.setItem(LS_PREFIX + key, JSON.stringify(value));
    }
    return true;
  }catch(e){
    console.error('saveKey', key, e);
    toast('No se pudo guardar (' + key + '). Revisa la consola del navegador.', true);
    return false;
  }
}

const RANGOS_DEFAULT = {

function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }

function toast(msg, isErr){
  const el = document.createElement('div');
  el.className = 'toast' + (isErr ? ' err' : '');
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(()=>el.remove(), 3200);
}

/* Acordeón animado — funciona igual con click (mouse) y tap (móvil) */
function acc(titulo, cuerpoHtml){
  return `<div class="acc">
    <button type="button" class="acc-header" onclick="toggleAcc(this)"><span class="chev">▶</span> ${titulo}</button>
    <div class="acc-body"><div class="acc-body-inner">${cuerpoHtml}</div></div>
  </div>`;
}
function toggleAcc(headerEl){
  const body = headerEl.nextElementSibling;
  const abriendo = !headerEl.classList.contains('open');
  if(abriendo){
    headerEl.classList.add('open');
    body.style.maxHeight = body.scrollHeight + 'px';
    const onEnd = (e)=>{
      if(e.propertyName !== 'max-height') return;
      if(headerEl.classList.contains('open')) body.style.maxHeight = 'none';
      body.removeEventListener('transitionend', onEnd);
    };
    body.addEventListener('transitionend', onEnd);
  } else {
    body.style.maxHeight = body.scrollHeight + 'px';
    requestAnimationFrame(()=>{ body.style.maxHeight = '0px'; });
    headerEl.classList.remove('open');
  }
}

async function hashPass(password, salt){
  const enc = new TextEncoder().encode(salt + password);
  const buf = await crypto.subtle.digest('SHA-256', enc);
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}
function genSalt(){ return uid() + uid(); }
const ALFA_CODIGO = "ABCDEFGHJKMNPQRSTUVWXYZ23456789";
function generarCodigoAleatorio(len=6){
  let s=''; for(let i=0;i<len;i++) s += ALFA_CODIGO[Math.floor(Math.random()*ALFA_CODIGO.length)];
  return s;
}

/* ---------- helpers de datos ---------- */
async function ensureRangosSeed(){
  const r = await loadKey(KEYS.rangos, null);
  if(!r){ await saveKey(KEYS.rangos, RANGOS_DEFAULT); }
}
async function obtenerRangos(tipo){
  const r = await loadKey(KEYS.rangos, RANGOS_DEFAULT);
  return r[tipo] || r["Vivienda"] || RANGOS_DEFAULT["Vivienda"];
}
function clasificarNivel(cantidad, rangos){
  for(const nivel of NIVELES){
    const [min,max] = rangos[nivel];
    if(cantidad < min) continue;
    if(max===null || cantidad<=max) return nivel;
  }
  return "Alta";
}
async function obtenerListaClientes(){
  const clientes = await loadKey(KEYS.clientes, []);
  const usuarios = await loadKey(KEYS.usuarios, []);
  const locales = clientes.map(c=>c.nombreLocal);
  const usrCli = usuarios.filter(u=>u.rol==='Cliente').map(u=>u.nombre);
  return [...new Set([...locales, ...usrCli])].sort();
}
async function obtenerTipoCliente(nombre){
  const clientes = await loadKey(KEYS.clientes, []);
  const c = clientes.find(c=>c.nombreLocal.toLowerCase()===String(nombre).toLowerCase());
  return c && c.tipo ? c.tipo : "Vivienda";
}
function resizeImage(dataUrl, maxW, quality){
  return new Promise(resolve=>{
    const img = new Image();
    img.onload = ()=>{
      const scale = Math.min(1, maxW / img.width);
      const c = document.createElement('canvas');
      c.width = img.width*scale; c.height = img.height*scale;
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      resolve(c.toDataURL('image/jpeg', quality||0.7));
    };
    img.src = dataUrl;
  });
}
function fileToDataUrl(file){
  return new Promise((resolve,reject)=>{
    const r = new FileReader();
    r.onload = ()=>resolve(r.result);
    r.onerror = reject;
    r.readAsDataURL(file);
  });
}

        <div class="field"><label>Confirmar contraseña</label><input type="password" id="regPass2" required></div>

function wireAuthEvents(){
  document.getElementById('authPanel').innerHTML = loginFormHtml();
  wirePanelEvents('login');
}
function wirePanelEvents(which){
  if(which==='login'){
    document.getElementById('formLogin').addEventListener('submit', async (e)=>{
      e.preventDefault();
      const correo = document.getElementById('loginCorreo').value.trim().toLowerCase();
      const pass = document.getElementById('loginPass').value;
      const usuarios = await loadKey(KEYS.usuarios, []);
      const u = usuarios.find(u=>u.correo===correo);
      if(!u){ toast(TIENE_CLOUD_STORAGE ? 'No existe una cuenta con ese correo.' : 'No existe esa cuenta en este navegador (el guardado es local a cada navegador).', true); return; }
      const h = await hashPass(pass, u.salt);
      if(h !== u.passHash){ toast('Contraseña incorrecta.', true); return; }
      session = {id:u.id, nombre:u.nombre, correo:u.correo, rol:u.rol, telefono:u.telefono};
      navTecnico = "Inicio"; navCliente = "Inicio";
      render();
    });
  } else {
    document.getElementById('formRegistro').addEventListener('submit', async (e)=>{
      e.preventDefault();
      const nombre = document.getElementById('regNombre').value.trim();
      const correo = document.getElementById('regCorreo').value.trim().toLowerCase();
      const telefono = document.getElementById('regTelefono').value.trim();
      const rol = document.getElementById('regRol').value;
      const codigo = document.getElementById('regCodigo').value.trim().toUpperCase();
      const pass1 = document.getElementById('regPass1').value;
      const pass2 = document.getElementById('regPass2').value;

      if(!nombre || !correo || !pass1){ toast('Completa los campos obligatorios.', true); return; }
      if(!correo.includes('@') || !correo.split('@').pop().includes('.')){ toast('Correo inválido.', true); return; }
      if(telefono && !/^\d{10}$/.test(telefono)){ toast('El teléfono debe tener 10 dígitos.', true); return; }
      if(pass1.length < 6){ toast('La contraseña debe tener al menos 6 caracteres.', true); return; }
      if(pass1 !== pass2){ toast('Las contraseñas no coinciden.', true); return; }

      const usuarios = await loadKey(KEYS.usuarios, []);
      if(usuarios.some(u=>u.correo===correo)){ toast('Ese correo ya está registrado.', true); return; }

      let tecnicoAsignado = null;
      if(rol==='Cliente' && codigo){
        const tec = usuarios.find(u=>u.rol==='Técnico' && u.codigoTecnico===codigo);
        if(!tec){ toast('El código de técnico no es válido.', true); return; }
        tecnicoAsignado = tec.nombre;
      }
      let salt, passHash;
      try{
        salt = genSalt();
        passHash = await hashPass(pass1, salt);
      }catch(err){
        console.error(err);
        toast('Tu navegador no permite cifrar la contraseña aquí. Prueba abriendo el archivo dentro de Claude o en un navegador moderno.', true);
        return;
      }
      const nuevo = {id:uid(), nombre, correo, telefono, rol, salt, passHash, codigoTecnico:null};
      usuarios.push(nuevo);
      const ok = await saveKey(KEYS.usuarios, usuarios);
      if(!ok){ toast('No se pudo guardar tu cuenta. Intenta de nuevo.', true); return; }

      // Verificación real: releemos para confirmar que el usuario quedó persistido
      const verificacion = await loadKey(KEYS.usuarios, []);
      if(!verificacion.some(u=>u.correo===correo)){
        toast('El guardado no se confirmó. Vuelve a intentar el registro.', true);
        return;
      }

      if(tecnicoAsignado){
        const clientes = await loadKey(KEYS.clientes, []);
        if(!clientes.some(c=>c.nombreLocal===nombre)){
          clientes.push({id:uid(), nombreLocal:nombre, responsable:nombre, telefono, direccion:'', tecnicoAsignado, tipo:'Vivienda'});
          await saveKey(KEYS.clientes, clientes);
        }
      }
      toast('Cuenta creada y confirmada. Ahora puedes iniciar sesión.');
      switchAuthTab('login');
      const loginCorreoEl = document.getElementById('loginCorreo');
      if(loginCorreoEl) loginCorreoEl.value = correo;
    });
  }
}

function tabIcon(t){
  const m = {"Inicio":"🏠","Productos Químicos":"🧪","Registrar Servicio":"➕","Gestión Clientes":"👥",
    "Historial":"📊","Configurar Rangos":"⚙️","Ubicación":"📍","Mensajería":"💬","Mis Servicios":"📋","Nivel de Infestación":"📈"};
  return m[t] || "";
}
function logout(){ session=null; render(); }
function goTab(t){
  if(session.rol==='Técnico') navTecnico=t; else navCliente=t;
  render();
}
async function wireShellEvents(){
  const el = document.getElementById('mainContent');
  const tab = session.rol==='Técnico' ? navTecnico : navCliente;
  el.innerHTML = await renderTabContent(tab);
  wireTabEvents(tab);
}

async function renderTabContent(tab){
  switch(tab){
    case 'Inicio': return catalogoPlagasHtml();
    case 'Productos Químicos': return catalogoQuimicosHtml();
    case 'Registrar Servicio': return await registrarServicioHtml();
    case 'Gestión Clientes': return await gestionClientesHtml();
    case 'Historial': return await historialHtml();
    case 'Configurar Rangos': return await configurarRangosHtml();
    case 'Ubicación': return ubicacionHtml();
    case 'Mensajería': return await mensajeriaHtml();
    case 'Mis Servicios': return await misServiciosHtml();
    case 'Nivel de Infestación': return await nivelInfestacionHtml(session.nombre);
    default: return '';
  }
}
async function wireTabEvents(tab){
  if(tab==='Registrar Servicio') wireRegistrarServicio();
  if(tab==='Gestión Clientes') wireGestionClientes();
  if(tab==='Configurar Rangos') wireConfigurarRangos();
  if(tab==='Ubicación') wireUbicacion();
  if(tab==='Mensajería') wireMensajeria();

}

function wireRegistrarServicio(){
  const canvas = document.getElementById('firmaCanvas');
  firmaCtx = canvas.getContext('2d');
  firmaCtx.fillStyle = '#fff'; firmaCtx.fillRect(0,0,canvas.width,canvas.height);
  firmaCtx.strokeStyle = '#111'; firmaCtx.lineWidth = 2.4; firmaCtx.lineCap = 'round';
  firmaTieneTrazo = false;

  function pos(e){
    const r = canvas.getBoundingClientRect();
    const cx = (e.touches ? e.touches[0].clientX : e.clientX) - r.left;
    const cy = (e.touches ? e.touches[0].clientY : e.clientY) - r.top;
    return [cx * canvas.width / r.width, cy * canvas.height / r.height];
  }
  function start(e){ e.preventDefault(); firmaDrawing = true; const [x,y]=pos(e); firmaCtx.beginPath(); firmaCtx.moveTo(x,y); }
  function move(e){ if(!firmaDrawing) return; e.preventDefault(); const [x,y]=pos(e); firmaCtx.lineTo(x,y); firmaCtx.stroke(); firmaTieneTrazo = true; }
  function end(){ firmaDrawing = false; }
  canvas.addEventListener('mousedown', start); canvas.addEventListener('mousemove', move); window.addEventListener('mouseup', end);
  canvas.addEventListener('touchstart', start); canvas.addEventListener('touchmove', move); canvas.addEventListener('touchend', end);

  document.getElementById('btnLimpiarFirma').addEventListener('click', ()=>{
    firmaCtx.fillStyle = '#fff'; firmaCtx.fillRect(0,0,canvas.width,canvas.height); firmaTieneTrazo = false;
  });

  document.getElementById('rsCliente').addEventListener('change', async (e)=>{
    const tipo = await obtenerTipoCliente(e.target.value);
    const rangos = await obtenerRangos(tipo);
    document.getElementById('rsRangosInfo').innerHTML = rangosInfoHtml(tipo, rangos);
  });

  document.getElementById('btnGuardarServicio').addEventListener('click', async ()=>{
    const cliente = document.getElementById('rsCliente').value;
    const plaga = document.getElementById('rsPlaga').value.trim();
    const tratamiento = document.getElementById('rsTratamiento').value.trim();
    const cantidad = parseInt(document.getElementById('rsCantidad').value || '0', 10);
    const estatus = document.getElementById('rsEstatus').value;
    const tecnico = document.getElementById('rsTecnico').value.trim() || session.nombre;
    const encargado = document.getElementById('rsEncargado').value.trim();
    const fileInput = document.getElementById('rsEvidencia');
    const certInput = document.getElementById('rsCertificado');

    if(!cliente || cliente==='Sin clientes'){ toast('Registra al menos un cliente primero.', true); return; }
    if(!encargado){ toast('Indica el nombre del encargado que firma la conformidad.', true); return; }
    if(!firmaTieneTrazo){ toast('Falta la firma del encargado.', true); return; }

    let evidenciaBase64 = '';
    if(fileInput.files[0]){
      const raw = await fileToDataUrl(fileInput.files[0]);
      evidenciaBase64 = await resizeImage(raw, 640, 0.7);
    }

    let certificadoBase64 = '', certificadoNombre = '';
    if(certInput.files[0]){
      const cf = certInput.files[0];
      if(cf.size > 4 * 1024 * 1024){
        toast('El certificado pesa demasiado (máx. ~4 MB). No se adjuntó.', true);
      } else if(cf.type.startsWith('image/')){
        const raw = await fileToDataUrl(cf);
        certificadoBase64 = await resizeImage(raw, 900, 0.75);
        certificadoNombre = cf.name.replace(/\.[^.]+$/, '') + '.jpg';
      } else {
        certificadoBase64 = await fileToDataUrl(cf);
        certificadoNombre = cf.name;
      }
    }
    const firmaBase64 = canvas.toDataURL('image/png');

    const tipo = await obtenerTipoCliente(cliente);
    const rangos = await obtenerRangos(tipo);
    const nivel = clasificarNivel(cantidad, rangos);

    const reportes = await loadKey(KEYS.reportes, []);
    reportes.unshift({
      id: uid(), cliente, tecnico, plaga, tratamiento, estatus,
      fecha: new Date().toISOString(), evidencia: evidenciaBase64,
      nivel, cantidad, encargado, firma: firmaBase64,
      certificado: certificadoBase64, certificadoNombre
    });
    await saveKey(KEYS.reportes, reportes);
    toast(`Servicio registrado. Nivel de infestación: ${nivel} (${cantidad} observadas).`);
    render();
  });

function ubicacionHtml(){
  return `
  <h2>📍 Geolocalización y Control de Servicios</h2>
  <p class="muted">Tu navegador pedirá permiso para compartir tu ubicación. Acepta el permiso para verla en el mapa.</p>
  <div class="card">
    <div id="geoStatus" class="muted" style="margin-bottom:10px;">Solicitando ubicación…</div>
    <div id="map"></div>
  </div>`;
}
function wireUbicacion(){
  const statusEl = document.getElementById('geoStatus');
  if(!navigator.geolocation){ statusEl.textContent = 'Este navegador no soporta geolocalización.'; statusEl.style.color='var(--red)'; return; }
  navigator.geolocation.getCurrentPosition(pos=>{
    const {latitude:lat, longitude:lon, accuracy} = pos.coords;
    statusEl.textContent = 'Ubicación obtenida (precisión aprox. ' + Math.round(accuracy) + ' m)';
    statusEl.style.color = 'var(--green)';
    const map = L.map('map').setView([lat,lon],16);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap'}).addTo(map);
    L.marker([lat,lon]).addTo(map).bindPopup('Tu ubicación actual').openPopup();
    L.circle([lat,lon],{radius:accuracy,color:'#3b9be0',fillColor:'#3b9be0',fillOpacity:.15}).addTo(map);
  }, err=>{
    statusEl.textContent = 'No se pudo obtener tu ubicación (' + err.message + '). Revisa los permisos del navegador.';
    statusEl.style.color = 'var(--red)';
  }, {enableHighAccuracy:true, timeout:12000, maximumAge:0});
}

async function pintarChat(){
  const mensajes = await loadKey(KEYS.mensajes, []);
  const conv = mensajes.filter(m=>(m.de===session.nombre && m.a===chatContacto) || (m.de===chatContacto && m.a===session.nombre));
  const box = document.getElementById('chatBox');
  box.innerHTML = conv.length ? conv.map(m=>{

    const hora = new Date(m.fecha).toLocaleTimeString('es-MX',{hour:'2-digit',minute:'2-digit'});
    return `<div class="msg ${mine?'mine':'theirs'}"><div class="meta">${m.de} · ${hora}</div>${m.texto}</div>`;
  }).join('') : '<p class="muted">No hay mensajes previos. ¡Inicia el chat!</p>';
  box.scrollTop = box.scrollHeight;
}
function wireMensajeria(){
  const sel = document.getElementById('msContacto');
  if(!sel) return;
  pintarChat();
  sel.addEventListener('change', ()=>{ chatContacto = sel.value; pintarChat(); });
  document.getElementById('formChat').addEventListener('submit', async e=>{
    e.preventDefault();
    const input = document.getElementById('chatInput');
    const texto = input.value.trim();
    if(!texto) return;
    const mensajes = await loadKey(KEYS.mensajes, []);
    mensajes.push({de:session.nombre, a:chatContacto, texto, fecha:new Date().toISOString()});
    await saveKey(KEYS.mensajes, mensajes);
    input.value = '';
    pintarChat();
  });
}

async function nivelInfestacionHtml(clienteFiltro){

  </div>`;

async function wireGraficaInfestacion(clienteFiltro, targetId){
  const wrapId = targetId || null;
  const reportes = await loadKey(KEYS.reportes, []);
  const filtrados = clienteFiltro ? reportes.filter(r=>r.cliente.toLowerCase()===clienteFiltro.toLowerCase()) : reportes;
  const anios = [...new Set(filtrados.map(r=>new Date(r.fecha).getFullYear()))];
  const anioActual = new Date().getFullYear();
  if(!anios.includes(anioActual)) anios.unshift(anioActual);
  anios.sort((a,b)=>b-a);

  function pintar(anio){
    const meses = Array.from({length:12},(_,i)=>i);
    const datos = {Baja:Array(12).fill(0), Media:Array(12).fill(0), Alta:Array(12).fill(0)};
    filtrados.filter(r=>new Date(r.fecha).getFullYear()===anio).forEach(r=>{
      const m = new Date(r.fecha).getMonth();
      if(datos[r.nivel]) datos[r.nivel][m]++;
    });
    const total = NIVELES.reduce((s,n)=>s+datos[n].reduce((a,b)=>a+b,0),0);

    if(wrapId){
      const wrap = document.getElementById(wrapId);
      if(!wrap) return;
      if(total===0){ wrap.innerHTML = `<p class="muted">Aún no hay servicios registrados en ${anio} para graficar.</p>`; return; }
    }
    const metricsEl = document.getElementById('niMetrics');
    if(metricsEl){
      metricsEl.innerHTML = NIVELES.map(n=>`<div class="metric"><div class="n">${datos[n].reduce((a,b)=>a+b,0)}</div><div class="muted">${DESCRIPCION_NIVEL[n][0]} Total ${n}</div></div>`).join('');
    }
    const canvasId = wrapId ? null : 'niChart';
    let canvas = wrapId ? document.getElementById(wrapId) : document.getElementById('niChart');
    if(wrapId){
      wrap.innerHTML = total===0 ? '' : '<canvas id="rsChart" height="90"></canvas>';
      canvas = document.getElementById('rsChart');
      if(!canvas) return;
    }
    if(chartRef){ chartRef.destroy(); chartRef=null; }
    if(!canvas) return;
    chartRef = new Chart(canvas.getContext('2d'), {
      type:'bar',
      data:{
        labels:['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'],
        datasets:[
          {label:'Baja', data:datos.Baja, backgroundColor:'#59b37d'},
          {label:'Media', data:datos.Media, backgroundColor:'#f2a30f'},
          {label:'Alta', data:datos.Alta, backgroundColor:'#e0483f'}
        ]
      },
      options:{
        responsive:true,
        plugins:{legend:{labels:{color:'#eef6f2'}}},
        scales:{
          x:{ticks:{color:'#8fada3'}, grid:{color:'#24463c'}},
          y:{ticks:{color:'#8fada3', precision:0}, grid:{color:'#24463c'}, beginAtZero:true}
        }
      }
    });
  }

  if(!wrapId){
    const yearWrap = document.getElementById('niYearSel');
    yearWrap.innerHTML = `<label>Año a consultar</label><select id="niYear">${anios.map(a=>`<option value="${a}">${a}</option>`).join('')}</select>`;
    document.getElementById('niYear').addEventListener('change', e=>pintar(parseInt(e.target.value,10)));
    pintar(anios[0]);
  } else {
    pintar(anioActual);
  }
}
